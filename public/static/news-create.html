
<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Иловаи хабар — NewsPortal</title>
    <link rel="stylesheet" href="/NewsPortal/public/assets/CSS/style.css">
</head>
<body>

<header class="site-header">
    <div class="container header-content">
        <a href="/NewsPortal/" class="logo">
            News<span>Portal</span>
        </a>
    </div>
</header>

<main class="container">
    <section class="latest-news">
        <h1>Илова кардани хабар</h1>
        <p>Барои илова кардани хабар майдонҳоро пур кунед.</p>

        <form id="news-create-form" novalidate>

            <div class="form-group">
                <label for="title">Сарлавҳаи хабар</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    required
                    minlength="5"
                >
                <p id="title-error" class="field-error"></p>
            </div>

            <div class="form-group">
                <label for="excerpt">Тавсифи кӯтоҳ</label>
                <textarea
                    id="excerpt"
                    name="excerpt"
                    required
                ></textarea>
                <p id="excerpt-error" class="field-error"></p>
            </div>

            <div class="form-group">
                <label for="content">Матни пурраи хабар</label>
                <textarea
                    id="content"
                    name="content"
                    rows="8"
                    required
                ></textarea>
                <p id="content-error" class="field-error"></p>
            </div>

            <button type="submit" class="primary-button">
                Сабт кардан
            </button>

        </form>
    </section>
</main>

<script type="module" src="/NewsPortal/public/assets/js/app.js"></script>

</body>
</html>
